<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>אגודת שתולים</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root { --primary-color: #1E3A8A; --primary-light: #3B82F6; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 1.1rem; color: #2b2b2b; background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); min-height: 100vh; word-break: break-word; }
    .glass-panel { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07); border-radius: 16px; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .glass-panel:hover { box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.12); }
    .dark-glass { background: rgba(20, 25, 40, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); border-radius: 20px; color: #ffffff; }
    .poll-option-wrapper { background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 12px; padding: 15px 15px; margin-bottom: 12px; cursor: pointer; transition: background 0.2s; }
    .poll-option-wrapper:hover { background: rgba(255, 255, 255, 0.9); }
    .poll-option-wrapper input[type="radio"] { transform: scale(1.5); margin-left: 12px; cursor: pointer; }
    .poll-option-wrapper label { cursor: pointer; width: 100%; font-size: 1.1rem; font-weight: 500; }
    .max-w-800 { max-width: 800px; margin: 0 auto; }
    .bg-gradient-primary { background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%); }
    .card-modern { border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); background: #fff; }
    .nav-scrollable { display: flex; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 5px; gap: 8px; }
    .nav-scrollable::-webkit-scrollbar { display: none; }
    .nav-pills .nav-link { color: #6c757d; background-color: transparent; transition: all 0.3s ease; white-space: nowrap; font-size: 1rem; }
    .nav-pills .nav-link.active { background-color: var(--primary-color); color: white; box-shadow: 0 4px 10px rgba(30, 58, 138, 0.3); }
    .admin-toolbar { background: rgba(255,255,255,0.7); border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; padding: 10px; margin-top: 15px; }
    /* Mobile tweaks */
    @media (max-width: 576px) { .glass-panel { padding: 1rem !important; } .btn-lg { font-size: 1.1rem; padding: 0.6rem 1rem; } }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-gradient-primary shadow-sm mb-4 py-3">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div class="d-flex align-items-center gap-2 text-white">
        <img id="app-logo" src="" alt="Logo" class="d-none bg-white p-1 shadow-sm" style="max-height: 40px; border-radius: 8px; object-fit: contain;">
        <span class="navbar-brand mb-0 h1 fw-bold fs-4" id="app-title-display">טוען...</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="form-check form-switch text-white d-none" id="preview-mode-wrapper">
          <input class="form-check-input mt-1" type="checkbox" id="preview-mode-toggle" onchange="togglePreviewMode()">
          <label class="form-check-label ms-2 fw-medium small" for="preview-mode-toggle"><i class="bi bi-eye"></i> חבר</label>
        </div>
        <button class="btn btn-outline-light rounded-pill px-3 shadow-sm" id="nav-login-btn" onclick="authModalInstance.show()"><i class="bi bi-person-circle me-1"></i> התחברות</button>
      </div>
    </div>
  </nav>

  <div class="container pb-5 max-w-800">
    <ul class="nav nav-pills nav-scrollable mb-4 glass-panel p-2" id="mainTabs" role="tablist">
      <li class="nav-item"><button class="nav-link active py-2 px-3 rounded-pill fw-bold" id="messages-tab" data-bs-toggle="pill" data-bs-target="#view-messages"><i class="bi bi-megaphone fs-5 me-2"></i>הודעות</button></li>
      <li class="nav-item"><button class="nav-link py-2 px-3 rounded-pill fw-bold" id="polls-tab" data-bs-toggle="pill" data-bs-target="#view-polls"><i class="bi bi-ui-checks fs-5 me-2"></i>הצבעות</button></li>
      <li class="nav-item d-none admin-only-ui"><button class="nav-link text-primary py-2 px-3 rounded-pill fw-bold" id="members-tab" data-bs-toggle="pill" data-bs-target="#view-members"><i class="bi bi-people fs-5 me-2"></i>חברים</button></li>
      <li class="nav-item d-none admin-only-ui"><button class="nav-link text-secondary py-2 px-3 rounded-pill fw-bold" id="settings-tab" data-bs-toggle="pill" data-bs-target="#view-settings"><i class="bi bi-gear fs-5 me-2"></i>הגדרות</button></li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="view-messages">
        <div class="d-none admin-only-ui mb-4 text-start"><button class="btn btn-primary rounded-pill fw-bold shadow-sm px-4 py-2" onclick="newMsgModalInstance.show()"><i class="bi bi-plus-lg me-2"></i>הודעה חדשה</button></div>
        <div id="messages-container" class="text-center mt-5"><div class="spinner-border text-primary"></div></div>
      </div>
      <div class="tab-pane fade" id="view-polls">
        <div class="d-none admin-only-ui mb-4 text-start"><button class="btn btn-success rounded-pill fw-bold shadow-sm px-4 py-2" onclick="newPollModalInstance.show()"><i class="bi bi-plus-lg me-2"></i>סקר חדש</button></div>
        <div id="polls-container" class="text-center mt-5"><div class="spinner-border text-primary"></div></div>
      </div>
      <div class="tab-pane fade admin-only-ui" id="view-members">
        <div class="card card-modern border-0"><div class="card-body p-3 p-md-4"><div class="d-flex justify-content-between align-items-center mb-4"><h4 class="card-title text-dark fw-bold mb-0 fs-5"><i class="bi bi-people me-2"></i>חברים</h4><div class="d-flex gap-2"><button class="btn btn-success rounded-pill" onclick="exportMembersToCSV()"><i class="bi bi-file-earmark-excel"></i></button><button class="btn btn-dark rounded-pill" onclick="openMemberModal()"><i class="bi bi-person-plus"></i></button></div></div><div class="table-responsive"><table class="table table-hover align-middle small"><thead><tr><th>ת"ז</th><th>שם</th><th>משפחה</th><th>טלפון</th><th>משק</th><th>תפקיד</th><th>הרשאה</th><th>סטטוס</th><th></th></tr></thead><tbody id="admin-members-list"></tbody></table></div></div></div>
      </div>
      <div class="tab-pane fade admin-only-ui" id="view-settings">
        <div class="card card-modern border-0"><div class="card-body p-4"><h4 class="card-title text-dark fw-bold mb-4 fs-5"><i class="bi bi-sliders me-2"></i>הגדרות</h4><div class="mb-3"><label class="form-label fw-bold">כותרת המערכת</label><input type="text" id="admin-setting-title" class="form-control form-control-lg"></div><div class="mb-4"><label class="form-label fw-bold">קישור לוגו</label><input type="url" id="admin-setting-logo" class="form-control form-control-lg text-start" dir="ltr"></div><button class="btn btn-dark btn-lg w-100 rounded-pill fw-bold" onclick="saveSettings()" id="btn-save-settings"><i class="bi bi-save me-2"></i>שמור הגדרות</button></div></div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index: 1060;"><div id="sysToast" class="toast align-items-center text-bg-primary border-0 rounded-4 shadow-lg"><div class="d-flex p-2"><div class="toast-body fs-6 fw-medium" id="sysToastMsg"></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div>

  <!-- Modals -->
  <div class="modal fade" id="authModal" tabindex="-1" data-bs-backdrop="static"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow-lg rounded-4"><div class="modal-header bg-gradient-primary text-white border-0 rounded-top-4 py-3"><h5 class="modal-title fw-bold"><i class="bi bi-shield-lock me-2"></i>אימות</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><div id="step-1"><input type="tel" id="id-input" class="form-control form-control-lg mb-4 text-center fs-4 tracking-wide" placeholder="תעודת זהות"><button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold" id="btn-request-otp" onclick="handleRequestOTP()">שלח קוד לאימייל</button></div><div id="step-2" class="d-none"><input type="tel" id="otp-input" class="form-control form-control-lg mb-4 text-center fs-3 tracking-wide text-primary fw-bold" placeholder="- - - - - -"><button class="btn btn-success btn-lg w-100 rounded-pill fw-bold mb-3" id="btn-verify-otp" onclick="handleVerifyOTP()">אמת</button><button class="btn btn-light btn-lg w-100 rounded-pill text-secondary" onclick="resetAuthForm()">חזור</button></div><div id="auth-alert" class="alert d-none mt-4 mb-0 fs-6 rounded-3"></div></div></div></div></div>
  <div class="modal fade" id="newMsgModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content rounded-4 border-0 shadow"><div class="modal-header bg-primary text-white rounded-top-4 py-3"><h5 class="modal-title fw-bold"><i class="bi bi-plus-circle me-2"></i>הודעה חדשה</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><input type="text" id="new-msg-title" class="form-control mb-3" placeholder="כותרת"><textarea id="new-msg-content" class="form-control mb-3" rows="3" placeholder="תוכן..."></textarea><div class="row g-2 mb-3"><div class="col-12 col-md-6"><select id="new-msg-category" class="form-select"><option value="כללי">כללי</option><option value="דחוף">דחוף</option><option value="פנאי">פנאי</option></select></div><div class="col-12 col-md-6"><input type="datetime-local" id="new-msg-deadline" class="form-control"></div></div><div class="form-check form-switch mb-4 p-2 bg-light rounded"><input class="form-check-input ms-3" type="checkbox" id="new-msg-pinned"><label class="form-check-label fw-bold text-danger" for="new-msg-pinned">נעץ הודעה</label></div><button class="btn btn-primary w-100 rounded-pill fw-bold" onclick="submitNewMessage()" id="btn-submit-msg">פרסם</button></div></div></div></div>
  <div class="modal fade" id="newPollModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content rounded-4 border-0 shadow"><div class="modal-header bg-success text-white rounded-top-4 py-3"><h5 class="modal-title fw-bold"><i class="bi bi-plus-circle me-2"></i>סקר חדש</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><input type="text" id="new-poll-title" class="form-control mb-3" placeholder="נושא"><textarea id="new-poll-desc" class="form-control mb-3" rows="2" placeholder="תיאור..."></textarea><input type="text" id="new-poll-options" class="form-control mb-3" placeholder="אפשרויות (הפרד בפסיק)"><div class="row g-2 mb-3"><div class="col-12 col-md-6"><label class="form-label fw-bold small">מועד סגירה:</label><input type="datetime-local" id="new-poll-deadline" class="form-control"></div><div class="col-12 col-md-6"><label class="form-label fw-bold small">חשיפה:</label><select id="new-poll-visibility" class="form-select"><option value="always">גלויות תמיד</option><option value="after_close">לאחר סגירה</option></select></div></div><div class="form-check form-switch mb-4 p-2 bg-light rounded"><input class="form-check-input ms-3" type="checkbox" id="new-poll-secret" checked><label class="form-check-label fw-medium" for="new-poll-secret">חשאית</label></div><button class="btn btn-success w-100 rounded-pill fw-bold" onclick="submitNewPoll()" id="btn-submit-poll">פתח הצבעה</button></div></div></div></div>
  <div class="modal fade" id="resultsModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content dark-glass border-0 shadow-lg"><div class="modal-header border-bottom border-secondary py-3"><h5 class="modal-title fw-bold"><i class="bi bi-bar-chart-fill me-2"></i>תוצאות ההצבעה</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-4" id="resultsModalBody"><div class="text-center"><div class="spinner-border text-light"></div></div></div></div></div></div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://code.highcharts.com/highcharts-3d.js"></script>
  
  <script>
    // ⬇️⬇️⬇️ החלף את הכתובת הבאה בכתובת המלאה מגוגל Apps Script ⬇️⬇️⬇️
    const API_URL = "https://script.google.com/macros/s/AKfycbzogIrpMjnFr0adkt1O0ATUL1adqA82V7KXGuE5f46pDkD36-CqgH5kj696ZQeIVUcoOw/exec";
    // ⬆️⬆️⬆️
    
    let authModalInstance, memberModalInstance, resultsModalInstance, newMsgModalInstance, newPollModalInstance;
    let currentMembers=[], allPollsData=[], allMsgsData=[], isAdminUser=false, previewAsMember=false;

    async function apiCall(action, payload = {}) {
      try {
        const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, payload }) });
        return await response.json();
      } catch (e) { console.error(e); return { success: false, message: "שגיאת תקשורת עם השרת" }; }
    }

    document.addEventListener("DOMContentLoaded", () => {
      authModalInstance = new bootstrap.Modal(document.getElementById('authModal'));
      resultsModalInstance = new bootstrap.Modal(document.getElementById('resultsModal'));
      newMsgModalInstance = new bootstrap.Modal(document.getElementById('newMsgModal'));
      newPollModalInstance = new bootstrap.Modal(document.getElementById('newPollModal'));
      
      // Load from Local Cache instantly for fast UI feel
      const cachedData = sessionStorage.getItem('appDataCache');
      if (cachedData) {
        const parsed = JSON.parse(cachedData);
        allMsgsData = parsed.messages || []; allPollsData = parsed.polls || [];
        renderMessages(allMsgsData); renderPolls(allPollsData);
      }

      loadAppSettings(); checkLoginState();
    });

    function showToast(msg, type='primary') { const t = document.getElementById('sysToast'); t.className = `toast align-items-center text-bg-${type} border-0 rounded-4 shadow-lg`; document.getElementById('sysToastMsg').innerHTML = msg; new bootstrap.Toast(t, { delay: 3500 }).show(); }
    function setBtnLoading(btnId, isLoading, text) { const btn = document.getElementById(btnId); if(btn) { btn.disabled = isLoading; btn.innerHTML = isLoading ? `<span class="spinner-border spinner-border-sm me-2"></span>מעבד...` : text; } }

    function loadAppSettings() {
      apiCall('getAppSettings').then(settings => {
        document.title = settings.title || 'אגודה'; document.getElementById('admin-setting-title').value = settings.title || '';
        const logoEl = document.getElementById('app-logo');
        if(settings.logo) { logoEl.src = settings.logo; logoEl.classList.remove('d-none'); document.getElementById('app-title-display').innerHTML = settings.title; } else { logoEl.classList.add('d-none'); document.getElementById('app-title-display').innerHTML = '<i class="bi bi-houses me-2"></i>' + settings.title; }
        document.getElementById('admin-setting-logo').value = settings.logo || '';
      });
    }

    function saveSettings() {
      const t = document.getElementById('admin-setting-title').value.trim(), l = document.getElementById('admin-setting-logo').value.trim();
      setBtnLoading('btn-save-settings', true);
      apiCall('saveAppSettings', { adminId: localStorage.getItem("authMemberId"), title: t, logo: l }).then(res => { setBtnLoading('btn-save-settings', false, '<i class="bi bi-save me-2"></i>שמור הגדרות'); showToast(res.message, res.success ? "success" : "danger"); if(res.success) loadAppSettings(); });
    }

    function checkLoginState() {
      const savedId = localStorage.getItem("authMemberId");
      if (savedId) {
        document.getElementById("nav-login-btn").innerHTML = '<i class="bi bi-box-arrow-right me-1"></i> ניתוק';
        document.getElementById("nav-login-btn").className = "btn btn-light rounded-pill px-3 shadow-sm text-primary fw-bold";
        document.getElementById("nav-login-btn").onclick = () => { if(confirm("להתנתק?")) { localStorage.removeItem("authMemberId"); location.reload(); } };
        apiCall('checkAdminStatus', { memberId: savedId }).then(res => { isAdminUser = res.success || res; updateUIForAdmin(); if(isAdminUser) { document.getElementById("preview-mode-wrapper").classList.remove("d-none"); loadAdminMembers(); } loadData(); });
      } else {
        updateUIForAdmin(); document.getElementById("nav-login-btn").onclick = () => authModalInstance.show(); loadData();
      }
    }

    function updateUIForAdmin() { document.querySelectorAll('.admin-only-ui').forEach(el => { if(isAdminUser && !previewAsMember) el.classList.remove('d-none'); else el.classList.add('d-none'); }); }
    function togglePreviewMode() { previewAsMember = document.getElementById("preview-mode-toggle").checked; updateUIForAdmin(); renderMessages(allMsgsData); renderPolls(allPollsData); }

    function loadData() { 
      apiCall('getAppData').then(data => { 
        sessionStorage.setItem('appDataCache', JSON.stringify(data));
        allMsgsData = data.messages || []; allPollsData = data.polls || []; 
        renderMessages(allMsgsData); renderPolls(allPollsData); checkDeepLink(); 
      });
    }

    function checkDeepLink() {
      const params = new URLSearchParams(window.location.search); const pId = params.get('pollId');
      if(pId && allPollsData.some(p => p.id === pId)) {
        bootstrap.Tab.getInstance(document.getElementById('polls-tab')).show();
        setTimeout(() => { const el = document.getElementById('poll-card-'+pId); if(el) { el.scrollIntoView({behavior: 'smooth', block: 'center'}); el.style.boxShadow = "0 0 20px rgba(59, 130, 246, 0.8)"; setTimeout(()=> el.style.boxShadow = "", 3000); } }, 800);
      }
    }

    function renderMessages(msgs) {
      const cont = document.getElementById("messages-container"); cont.innerHTML = "";
      if (!msgs.length) return cont.innerHTML = "<div class='text-muted fs-4 mt-4'>אין הודעות.</div>";
      msgs.forEach(m => {
        let bClr = m.category==="דחוף" ? "bg-danger text-white" : (m.category==="פנאי" ? "bg-success text-success" : "bg-primary text-primary");
        const pinBadge = m.isPinned ? `<span class="badge bg-warning text-dark border ms-2 px-3 py-2 rounded-pill"><i class="bi bi-pin-angle-fill"></i> נעוץ</span>` : '';
        let adminToolbar = (isAdminUser && !previewAsMember) ? `<div class="admin-toolbar d-flex flex-wrap gap-2 justify-content-end mt-3"><button class="btn btn-sm btn-dark rounded-pill px-3" onclick="openEditMsg('${m.id}')"><i class="bi bi-pencil me-1"></i> ערוך</button><button class="btn btn-sm btn-danger rounded-pill px-3" onclick="deleteMsgAction('${m.id}')"><i class="bi bi-trash me-1"></i> מחק</button></div>` : '';
        cont.innerHTML += `<div class="glass-panel mb-4 text-start p-4"><div class="d-flex justify-content-between mb-3 border-bottom pb-2"><div><span class="badge ${bClr} bg-opacity-10 border fs-6 px-3 py-2 rounded-pill">${m.category}</span>${pinBadge}</div><small class="text-secondary fw-medium fs-6 mt-1">${m.timestamp}</small></div><h3 class="card-title fw-bold text-dark mb-3 fs-4">${m.title}</h3><p class="card-text text-secondary fs-6 lh-lg" style="white-space: pre-wrap;">${m.content}</p>${adminToolbar}</div>`;
      });
    }

    function renderPolls(polls) {
      const cont = document.getElementById("polls-container"); cont.innerHTML = "";
      if (!polls.length) return cont.innerHTML = "<div class='text-muted fs-4 mt-4'>אין סקרים כרגע.</div>";
      
      const baseUrl = window.location.origin + window.location.pathname;
      polls.forEach(p => {
        let opts = "";
        p.options.forEach((o, i) => { if(o.trim()) opts += `<div class="poll-option-wrapper d-flex align-items-center" onclick="document.getElementById('opt_${p.id}_${i}').checked = true;"><input class="form-check-input mt-0" type="radio" name="poll_${p.id}" id="opt_${p.id}_${i}" value="${o.trim()}"><label class="form-check-label text-dark" for="opt_${p.id}_${i}">${o.trim()}</label></div>`; });
        
        const now = new Date().getTime(); let isClosed = false, timeHtml = '';
        if(p.deadline) {
          const dl = new Date(p.deadline).getTime();
          if(now > dl) { isClosed = true; timeHtml = `<span class="badge bg-danger px-3 py-2 fs-6 rounded-pill mb-4"><i class="bi bi-clock-history me-1"></i> נסגר</span>`; } 
          else { timeHtml = `<span class="badge bg-warning text-dark px-3 py-2 fs-6 rounded-pill mb-4"><i class="bi bi-stopwatch me-1"></i> פתוח להצבעה</span>`; }
        }
        
        const shareUrl = `${baseUrl}?pollId=${p.id}`;
        const waText = encodeURIComponent(`הצבעה חדשה באגודה: ${p.title}\nלחצו כאן כדי להצביע:\n${shareUrl}`);
        const shareBtnHtml = `<a href="https://api.whatsapp.com/send?text=${waText}" target="_blank" class="btn btn-outline-success rounded-pill fw-bold w-100 mb-3 py-2"><i class="bi bi-whatsapp me-2"></i>שתף בוואטסאפ</a>`;
        
        let buttonsHtml = '';
        if(!isClosed) buttonsHtml += `<button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm py-2 mb-3" id="btn-vote-${p.id}" onclick="initiateVote('${p.id}')">שלח הצבעה</button>`;
        if(p.visibility === 'always' || (p.visibility === 'after_close' && isClosed)) buttonsHtml += `<button class="btn btn-outline-primary btn-lg w-100 rounded-pill fw-bold shadow-sm py-2 bg-white mb-3" onclick="viewResults('${p.id}')"><i class="bi bi-bar-chart-fill me-2"></i>תוצאות</button>`;
        
        let adminToolbar = (isAdminUser && !previewAsMember) ? `<div class="admin-toolbar d-flex flex-wrap gap-2 justify-content-end mt-4"><button class="btn btn-sm btn-primary rounded-pill px-3" onclick="viewResults('${p.id}')"><i class="bi bi-bar-chart"></i> תוצאות מנהל</button><button class="btn btn-sm btn-dark rounded-pill px-3" onclick="openEditPoll('${p.id}')"><i class="bi bi-pencil me-1"></i> ערוך</button><button class="btn btn-sm btn-danger rounded-pill px-3" onclick="deletePollAction('${p.id}')"><i class="bi bi-trash me-1"></i> מחק</button></div>` : '';
        
        cont.innerHTML += `<div id="poll-card-${p.id}" class="glass-panel mb-5 text-start p-4"><h3 class="card-title text-primary fw-bold mb-3 fs-4">${p.title}</h3><p class="card-text fs-6 text-secondary mb-4">${p.description}</p><div>${timeHtml}</div><div class="mb-4 pt-2">${opts}</div>${buttonsHtml}${shareBtnHtml}${adminToolbar}</div>`;
      });
    }

    function openEditMsg(id) { alert("יש לערוך הודעה דרך גוגל שיטס בשלב זה (פונקציונליות העריכה מותאמת בגרסה המלאה)."); }
    function deleteMsgAction(id) { if(confirm("למחוק הודעה?")) apiCall('deleteMessage', {adminId: localStorage.getItem("authMemberId"), msgId: id}).then(r => { showToast(r.message, r.success?"success":"danger"); loadData(); }); }
    function openEditPoll(id) { alert("יש לערוך סקר דרך גוגל שיטס בשלב זה."); }
    function deletePollAction(id) { if(confirm("למחוק סקר?")) apiCall('deletePoll', {adminId: localStorage.getItem("authMemberId"), pollId: id}).then(r => { showToast(r.message, r.success?"success":"danger"); loadData(); }); }

    function submitNewMessage() {
      const t = document.getElementById("new-msg-title").value.trim(), c = document.getElementById("new-msg-content").value.trim();
      if(!t || !c) return showToast("מלא כותרת ותוכן.", "warning");
      setBtnLoading('btn-submit-msg', true);
      apiCall('addMessage', { adminId: localStorage.getItem("authMemberId"), title: t, content: c, category: document.getElementById("new-msg-category").value, validUntil: document.getElementById("new-msg-deadline").value, isPinned: document.getElementById("new-msg-pinned").checked }).then(r => { 
        setBtnLoading('btn-submit-msg', false, 'פרסם'); showToast(r.message, r.success?"success":"danger"); if(r.success) { newMsgModalInstance.hide(); loadData(); } 
      });
    }
    
    function submitNewPoll() {
      const t = document.getElementById("new-poll-title").value.trim(), o = document.getElementById("new-poll-options").value.trim();
      if(!t || !o) return showToast("מלא נושא ואפשרויות.", "warning");
      setBtnLoading('btn-submit-poll', true);
      apiCall('addPoll', { adminId: localStorage.getItem("authMemberId"), title: t, description: document.getElementById("new-poll-desc").value.trim(), options: o, isSecret: document.getElementById("new-poll-secret").checked, deadline: document.getElementById("new-poll-deadline").value, visibility: document.getElementById("new-poll-visibility").value }).then(r => { 
        setBtnLoading('btn-submit-poll', false, 'פתח הצבעה'); showToast(r.message, r.success?"success":"danger"); if(r.success) { newPollModalInstance.hide(); loadData(); } 
      });
    }

    function initiateVote(pollId) { const opt = document.querySelector(`input[name="poll_${pollId}"]:checked`); if (!opt) return showToast("בחר אפשרות להצבעה.", "warning"); const savedId = localStorage.getItem("authMemberId"); if (!savedId) authModalInstance.show(); else { setBtnLoading(`btn-vote-${pollId}`, true); apiCall('submitVote', {pollId, memberId: savedId, voteSelection: opt.value}).then(r => { setBtnLoading(`btn-vote-${pollId}`, false, 'שלח הצבעה'); showToast(r.message, r.success?"success":"danger"); }); } }
    
    function viewResults(pollId) {
      document.getElementById("resultsModalBody").innerHTML = '<div class="text-center py-5"><div class="spinner-border text-light"></div></div>';
      resultsModalInstance.show();
      apiCall('getPollResults', { pollId, memberId: localStorage.getItem("authMemberId") || "" }).then(res => {
        if(!res.success) return document.getElementById("resultsModalBody").innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
        document.getElementById("resultsModalBody").innerHTML = `<h4 class="mb-4 text-center fw-bold" style="color:#e0eafc;">סה"כ מצביעים: <span style="color:#00ff9d;">${res.total}</span></h4><div style="position: relative;"><div id="pollChart3D" style="height: 380px; width: 100%; direction: ltr;"></div></div>`;
        Highcharts.chart('pollChart3D', { chart: { type: 'pie', backgroundColor: 'transparent', options3d: { enabled: true, alpha: 45, beta: 0 } }, title: { text: null }, tooltip: { pointFormat: 'קולות: <b>{point.y}</b> ({point.percentage:.1f}%)', style: { fontFamily: 'Segoe UI', fontSize: '14px', direction: 'rtl' }, useHTML: true }, plotOptions: { pie: { innerSize: '55%', depth: 40, dataLabels: { enabled: true, format: '<b>{point.name}</b><br>{point.percentage:.1f}%', style: { color: '#ffffff', textOutline: 'none', fontSize: '14px' } }, colors: ['#00f2fe', '#f093fb', '#00ff9d', '#ff0844', '#f5576c'] } }, series: [{ name: 'תוצאות', data: res.results.map(r => ({ name: r.option, y: r.votes })) }], credits: { enabled: false } });
      });
    }

    function showAuthAlert(msg) { const a = document.getElementById("auth-alert"); a.className = `alert alert-danger mt-4 mb-0 fs-6 rounded-3 border-0`; a.innerHTML = msg; a.classList.remove("d-none"); }
    function hideAuthAlert() { document.getElementById("auth-alert").classList.add("d-none"); }
    
    function handleRequestOTP() {
      const id = document.getElementById("id-input").value.trim(); if(!id) return showAuthAlert("הקלד תעודת זהות."); hideAuthAlert();
      setBtnLoading('btn-request-otp', true);
      apiCall('requestOTP', { memberId: id }).then(res => { setBtnLoading('btn-request-otp', false, 'שלח קוד לאימייל'); if(res.success) { document.getElementById("step-1").classList.add("d-none"); document.getElementById("step-2").classList.remove("d-none"); } else showAuthAlert(res.message); });
    }
    
    function handleVerifyOTP() {
      const id = document.getElementById("id-input").value.trim(), otp = document.getElementById("otp-input").value.trim(); if(!otp) return showAuthAlert("הזן קוד."); hideAuthAlert();
      setBtnLoading('btn-verify-otp', true);
      apiCall('verifyOTP', { memberId: id, otp }).then(res => { setBtnLoading('btn-verify-otp', false, 'אמת'); if(res.success) { localStorage.setItem("authMemberId", id); setTimeout(() => { authModalInstance.hide(); checkLoginState(); }, 1000); } else showAuthAlert(res.message); });
    }
  </script>
</body>
</html>
      <div class="d-flex align-items-center gap-3">
        <div class="form-check form-switch text-white d-none" id="preview-mode-wrapper">

          <label class="form-check-label ms-2 fw-medium" for="preview-mode-toggle"><i class="bi bi-eye"></i> חבר</label>

      <li class="nav-item"><button class="nav-link fs-5 py-2 px-4 rounded-pill fw-bold" id="polls-tab" data-bs-toggle="pill" data-bs-target="#view-polls"><i class="bi bi-ui-checks fs-5 me-2"></i>הצבעות</button></li>
      <li class="nav-item d-none admin-only-ui"><button class="nav-link text-primary fs-5 py-2 px-4 rounded-pill fw-bold" id="members-tab" data-bs-toggle="pill" data-bs-target="#view-members"><i class="bi bi-people fs-5 me-2"></i>חברים</button></li>
      <li class="nav-item d-none admin-only-ui"><button class="nav-link text-secondary fs-5 py-2 px-4 rounded-pill fw-bold" id="settings-tab" data-bs-toggle="pill" data-bs-target="#view-settings"><i class="bi bi-gear fs-5 me-2"></i>הגדרות</button></li>

        <div id="messages-container" class="text-center mt-5"><div class="spinner-border text-primary"></div></div>
      </div>

        <div class="card card-modern border-0"><div class="card-body p-3 p-md-4"><div class="d-flex justify-content-between align-items-center mb-4"><h4 class="card-title text-dark fw-bold mb-0"><i class="bi bi-people me-2"></i>חברים</h4><div class="d-flex gap-2"><button class="btn btn-success rounded-pill" onclick="exportMembersToCSV()"><i class="bi bi-file-earmark-excel"></i></button><button class="btn btn-dark rounded-pill" onclick="openMemberModal()"><i class="bi bi-person-plus"></i></button></div></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>ת"ז</th><th>שם</th><th>משפחה</th><th>טלפון</th><th>משק</th><th>תפקיד</th><th>הרשאה</th><th>סטטוס</th><th></th></tr></thead><tbody id="admin-members-list"></tbody></table></div></div></div>

        <div class="card card-modern border-0"><div class="card-body p-4"><h4 class="card-title text-dark fw-bold mb-4"><i class="bi bi-sliders me-2"></i>הגדרות</h4><div class="mb-3"><label class="form-label fw-bold">כותרת המערכת</label><input type="text" id="admin-setting-title" class="form-control form-control-lg"></div><div class="mb-4"><label class="form-label fw-bold">קישור לוגו</label><input type="url" id="admin-setting-logo" class="form-control form-control-lg text-start" dir="ltr"></div><button class="btn btn-dark btn-lg w-100 rounded-pill fw-bold" onclick="saveSettings()" id="btn-save-settings"><i class="bi bi-save me-2"></i>שמור הגדרות</button></div></div>
      </div>

  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index: 1060;"><div id="sysToast" class="toast align-items-center text-bg-primary border-0 rounded-4 shadow-lg"><div class="d-flex p-2"><div class="toast-body fs-5 fw-medium" id="sysToastMsg"></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div>

  <!-- Modals -->
  <div class="modal fade" id="authModal" tabindex="-1" data-bs-backdrop="static"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow-lg rounded-4"><div class="modal-header bg-gradient-primary text-white border-0 rounded-top-4 py-3"><h4 class="modal-title fw-bold"><i class="bi bi-shield-lock me-2"></i>אימות</h4><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><div id="step-1"><input type="tel" id="id-input" class="form-control form-control-lg mb-4 text-center fs-4 tracking-wide" placeholder="תעודת זהות"><button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold" id="btn-request-otp" onclick="handleRequestOTP()">שלח קוד לאימייל</button></div><div id="step-2" class="d-none"><input type="tel" id="otp-input" class="form-control form-control-lg mb-4 text-center fs-3 tracking-wide text-primary fw-bold" placeholder="- - - - - -"><button class="btn btn-success btn-lg w-100 rounded-pill fw-bold mb-3" id="btn-verify-otp" onclick="handleVerifyOTP()">אמת</button><button class="btn btn-light btn-lg w-100 rounded-pill text-secondary" onclick="resetAuthForm()">חזור</button></div><div id="auth-alert" class="alert d-none mt-4 mb-0 fs-5 rounded-3"></div></div></div></div></div>
  <div class="modal fade" id="newMsgModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content rounded-4 border-0 shadow"><div class="modal-header bg-primary text-white rounded-top-4 py-3"><h5 class="modal-title fw-bold"><i class="bi bi-plus-circle me-2"></i>הודעה חדשה</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><input type="text" id="new-msg-title" class="form-control mb-3" placeholder="כותרת"><textarea id="new-msg-content" class="form-control mb-3" rows="3" placeholder="תוכן..."></textarea><div class="row g-2 mb-3"><div class="col-12 col-md-6"><select id="new-msg-category" class="form-select"><option value="כללי">כללי</option><option value="דחוף">דחוף</option><option value="פנאי">פנאי</option></select></div><div class="col-12 col-md-6"><input type="datetime-local" id="new-msg-deadline" class="form-control"></div></div><div class="form-check form-switch mb-4 p-2 bg-light rounded"><input class="form-check-input ms-3" type="checkbox" id="new-msg-pinned"><label class="form-check-label fw-bold text-danger" for="new-msg-pinned">נעץ הודעה</label></div><button class="btn btn-primary w-100 rounded-pill fw-bold" onclick="submitNewMessage()" id="btn-submit-msg">פרסם</button></div></div></div></div>
  <div class="modal fade" id="newPollModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content rounded-4 border-0 shadow"><div class="modal-header bg-success text-white rounded-top-4 py-3"><h5 class="modal-title fw-bold"><i class="bi bi-plus-circle me-2"></i>סקר חדש</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><input type="text" id="new-poll-title" class="form-control mb-3" placeholder="נושא"><textarea id="new-poll-desc" class="form-control mb-3" rows="2" placeholder="תיאור..."></textarea><input type="text" id="new-poll-options" class="form-control mb-3" placeholder="אפשרויות (הפרד בפסיק)"><div class="row g-2 mb-3"><div class="col-12 col-md-6"><input type="datetime-local" id="new-poll-deadline" class="form-control"></div><div class="col-12 col-md-6"><select id="new-poll-visibility" class="form-select"><option value="always">גלויות תמיד</option><option value="after_close">לאחר סגירה</option></select></div></div><div class="form-check form-switch mb-4 p-2 bg-light rounded"><input class="form-check-input ms-3" type="checkbox" id="new-poll-secret" checked><label class="form-check-label fw-medium" for="new-poll-secret">חשאית</label></div><button class="btn btn-success w-100 rounded-pill fw-bold" onclick="submitNewPoll()" id="btn-submit-poll">פתח הצבעה</button></div></div></div></div>
  <div class="modal fade" id="resultsModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content dark-glass border-0 shadow-lg"><div class="modal-header border-bottom border-secondary py-3"><h4 class="modal-title fw-bold"><i class="bi bi-bar-chart-fill me-2"></i>תוצאות ההצבעה</h4><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-4" id="resultsModalBody"><div class="text-center"><div class="spinner-border text-light"></div></div></div></div></div></div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://code.highcharts.com/highcharts-3d.js"></script>
  
  <script>
    // ** עליך להחליף את הכתובת הזו בכתובת המלאה של פריסת ה-Apps Script שלך **
    const API_URL = "https://script.google.com/macros/s/AKfycbzogIrpMjnFr0adkt1O0ATUL1adqA82V7KXGuE5f46pDkD36-CqgH5kj696ZQeIVUcoOw/exec";
    
    let authModalInstance, memberModalInstance, resultsModalInstance, newMsgModalInstance, newPollModalInstance;
    let currentMembers=[], allPollsData=[], allMsgsData=[], isAdminUser=false, previewAsMember=false;

    async function apiCall(action, payload = {}) {
      try {
        const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, payload }) });
        return await response.json();
      } catch (e) { console.error(e); return { success: false, message: "שגיאת תקשורת עם השרת" }; }
    }

    document.addEventListener("DOMContentLoaded", () => {
      authModalInstance = new bootstrap.Modal(document.getElementById('authModal'));
      resultsModalInstance = new bootstrap.Modal(document.getElementById('resultsModal'));
      newMsgModalInstance = new bootstrap.Modal(document.getElementById('newMsgModal'));
      newPollModalInstance = new bootstrap.Modal(document.getElementById('newPollModal'));
      loadAppSettings(); checkLoginState();
    });

    function showToast(msg, type='primary') { const t = document.getElementById('sysToast'); t.className = `toast align-items-center text-bg-${type} border-0 rounded-4 shadow-lg`; document.getElementById('sysToastMsg').innerHTML = msg; new bootstrap.Toast(t, { delay: 3500 }).show(); }
    function setBtnLoading(btnId, isLoading, text) { const btn = document.getElementById(btnId); if(btn) { btn.disabled = isLoading; btn.innerHTML = isLoading ? `<span class="spinner-border spinner-border-sm me-2"></span>מעבד...` : text; } }

    function loadAppSettings() {
      apiCall('getAppSettings').then(settings => {
        document.title = settings.title || 'אגודה'; document.getElementById('admin-setting-title').value = settings.title || '';
        const logoEl = document.getElementById('app-logo');
        if(settings.logo) { logoEl.src = settings.logo; logoEl.classList.remove('d-none'); document.getElementById('app-title-display').innerHTML = settings.title; } else { logoEl.classList.add('d-none'); document.getElementById('app-title-display').innerHTML = '<i class="bi bi-houses me-2"></i>' + settings.title; }
        document.getElementById('admin-setting-logo').value = settings.logo || '';
      });
    }

    function saveSettings() {
      const t = document.getElementById('admin-setting-title').value.trim(), l = document.getElementById('admin-setting-logo').value.trim();
      setBtnLoading('btn-save-settings', true);
      apiCall('saveAppSettings', { adminId: localStorage.getItem("authMemberId"), title: t, logo: l }).then(res => { setBtnLoading('btn-save-settings', false, '<i class="bi bi-save me-2"></i>שמור הגדרות'); showToast(res.message, res.success ? "success" : "danger"); if(res.success) loadAppSettings(); });
    }

    function checkLoginState() {
      const savedId = localStorage.getItem("authMemberId");
      if (savedId) {
        document.getElementById("nav-login-btn").innerHTML = '<i class="bi bi-box-arrow-right me-1"></i> התנתק';
        document.getElementById("nav-login-btn").onclick = () => { if(confirm("להתנתק?")) { localStorage.removeItem("authMemberId"); location.reload(); } };
        apiCall('checkAdminStatus', { memberId: savedId }).then(res => { isAdminUser = res.success || res; updateUIForAdmin(); if(isAdminUser) { document.getElementById("preview-mode-wrapper").classList.remove("d-none"); loadAdminMembers(); } loadData(); });
      } else {
        updateUIForAdmin(); document.getElementById("nav-login-btn").onclick = () => authModalInstance.show(); loadData();
      }
    }

    function updateUIForAdmin() { document.querySelectorAll('.admin-only-ui').forEach(el => { if(isAdminUser && !previewAsMember) el.classList.remove('d-none'); else el.classList.add('d-none'); }); }
    function togglePreviewMode() { previewAsMember = document.getElementById("preview-mode-toggle").checked; updateUIForAdmin(); renderMessages(allMsgsData); renderPolls(allPollsData); }

    function loadData() { 
      apiCall('getAppData').then(data => { allMsgsData = data.messages || []; allPollsData = data.polls || []; renderMessages(allMsgsData); renderPolls(allPollsData); checkDeepLink(); });
    }

    function checkDeepLink() {
      const params = new URLSearchParams(window.location.search); const pId = params.get('pollId');
      if(pId && allPollsData.some(p => p.id === pId)) {
        bootstrap.Tab.getInstance(document.getElementById('polls-tab')).show();
        setTimeout(() => { const el = document.getElementById('poll-card-'+pId); if(el) { el.scrollIntoView({behavior: 'smooth', block: 'center'}); el.style.boxShadow = "0 0 20px rgba(59, 130, 246, 0.8)"; setTimeout(()=> el.style.boxShadow = "", 3000); } }, 800);
      }
    }

    function renderMessages(msgs) {
      const cont = document.getElementById("messages-container"); cont.innerHTML = "";
      if (!msgs.length) return cont.innerHTML = "<div class='text-muted fs-4 mt-4'>אין הודעות.</div>";
      msgs.forEach(m => {
        let bClr = m.category==="דחוף" ? "bg-danger text-white" : (m.category==="פנאי" ? "bg-success text-success" : "bg-primary text-primary");
        const pinBadge = m.isPinned ? `<span class="badge bg-warning text-dark border ms-2 px-3 py-2 rounded-pill"><i class="bi bi-pin-angle-fill"></i> נעוץ</span>` : '';
        let adminToolbar = (isAdminUser && !previewAsMember) ? `<div class="admin-toolbar d-flex gap-2 justify-content-end mt-3"><button class="btn btn-sm btn-danger rounded-pill px-3" onclick="deleteMsgAction('${m.id}')"><i class="bi bi-trash"></i> מחיקה</button></div>` : '';
        cont.innerHTML += `<div class="glass-panel mb-4 text-start p-4"><div class="d-flex justify-content-between mb-3 border-bottom pb-2"><div><span class="badge ${bClr} bg-opacity-10 border fs-6 px-3 py-2 rounded-pill">${m.category}</span>${pinBadge}</div><small class="text-secondary fw-medium fs-6 mt-1">${m.timestamp}</small></div><h3 class="card-title fw-bold text-dark mb-3">${m.title}</h3><p class="card-text text-secondary fs-5 lh-lg" style="white-space: pre-wrap;">${m.content}</p>${adminToolbar}</div>`;
      });
    }

    function renderPolls(polls) {
      const cont = document.getElementById("polls-container"); cont.innerHTML = "";
      if (!polls.length) return cont.innerHTML = "<div class='text-muted fs-4 mt-4'>אין סקרים כרגע.</div>";
      
      const baseUrl = window.location.origin + window.location.pathname;
      polls.forEach(p => {
        let opts = "";
        p.options.forEach((o, i) => { if(o.trim()) opts += `<div class="poll-option-wrapper d-flex align-items-center" onclick="document.getElementById('opt_${p.id}_${i}').checked = true;"><input class="form-check-input mt-0" type="radio" name="poll_${p.id}" id="opt_${p.id}_${i}" value="${o.trim()}"><label class="form-check-label text-dark" for="opt_${p.id}_${i}">${o.trim()}</label></div>`; });
        
        const now = new Date().getTime(); let isClosed = false, timeHtml = '';
        if(p.deadline) {
          const dl = new Date(p.deadline).getTime();
          if(now > dl) { isClosed = true; timeHtml = `<span class="badge bg-danger px-3 py-2 fs-6 rounded-pill mb-4"><i class="bi bi-clock-history me-1"></i> נסגר</span>`; } 
          else { timeHtml = `<span class="badge bg-warning text-dark px-3 py-2 fs-6 rounded-pill mb-4"><i class="bi bi-stopwatch me-1"></i> פתוח</span>`; }
        }
        
        const shareUrl = `${baseUrl}?pollId=${p.id}`;
        const waText = encodeURIComponent(`הצבעה חדשה באגודה: ${p.title}\nלחצו כאן כדי להצביע:\n${shareUrl}`);
        const shareBtnHtml = `<a href="https://api.whatsapp.com/send?text=${waText}" target="_blank" class="btn btn-outline-success rounded-pill fw-bold w-100 mb-3 py-2"><i class="bi bi-whatsapp me-2"></i>שתף בווטסאפ</a>`;
        
        let buttonsHtml = '';
        if(!isClosed) buttonsHtml += `<button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm py-3 mb-3" id="btn-vote-${p.id}" onclick="initiateVote('${p.id}')">שלח הצבעה</button>`;
        if(p.visibility === 'always' || (p.visibility === 'after_close' && isClosed)) buttonsHtml += `<button class="btn btn-outline-primary btn-lg w-100 rounded-pill fw-bold shadow-sm py-3 bg-white mb-3" onclick="viewResults('${p.id}')"><i class="bi bi-bar-chart-fill me-2"></i>תוצאות</button>`;
        
        let adminToolbar = (isAdminUser && !previewAsMember) ? `<div class="admin-toolbar d-flex flex-wrap gap-2 justify-content-end mt-4"><button class="btn btn-sm btn-primary rounded-pill px-3" onclick="viewResults('${p.id}')"><i class="bi bi-bar-chart"></i> תוצאות מנהל</button><button class="btn btn-sm btn-danger rounded-pill px-3" onclick="deletePollAction('${p.id}')"><i class="bi bi-trash"></i> מחק</button></div>` : '';
        
        cont.innerHTML += `<div id="poll-card-${p.id}" class="glass-panel mb-5 text-start p-4 p-md-5"><h3 class="card-title text-primary fw-bold mb-3">${p.title}</h3><p class="card-text fs-5 text-secondary mb-4">${p.description}</p><div>${timeHtml}</div><div class="mb-4 pt-2">${opts}</div>${buttonsHtml}${shareBtnHtml}${adminToolbar}</div>`;
      });
    }

    function deleteMsgAction(id) { if(confirm("למחוק הודעה?")) apiCall('deleteMessage', {adminId: localStorage.getItem("authMemberId"), msgId: id}).then(r => { showToast(r.message, r.success?"success":"danger"); loadData(); }); }
    function deletePollAction(id) { if(confirm("למחוק סקר?")) apiCall('deletePoll', {adminId: localStorage.getItem("authMemberId"), pollId: id}).then(r => { showToast(r.message, r.success?"success":"danger"); loadData(); }); }

    function submitNewMessage() {
      const t = document.getElementById("new-msg-title").value.trim(), c = document.getElementById("new-msg-content").value.trim();
      if(!t || !c) return showToast("מלא כותרת ותוכן.", "warning");
      setBtnLoading('btn-submit-msg', true);
      apiCall('addMessage', { adminId: localStorage.getItem("authMemberId"), title: t, content: c, category: document.getElementById("new-msg-category").value, validUntil: document.getElementById("new-msg-deadline").value, isPinned: document.getElementById("new-msg-pinned").checked }).then(r => { 
        setBtnLoading('btn-submit-msg', false, 'פרסם'); showToast(r.message, r.success?"success":"danger"); if(r.success) { newMsgModalInstance.hide(); loadData(); } 
      });
    }
    
    function submitNewPoll() {
      const t = document.getElementById("new-poll-title").value.trim(), o = document.getElementById("new-poll-options").value.trim();
      if(!t || !o) return showToast("מלא נושא ואפשרויות.", "warning");
      setBtnLoading('btn-submit-poll', true);
      apiCall('addPoll', { adminId: localStorage.getItem("authMemberId"), title: t, description: document.getElementById("new-poll-desc").value.trim(), options: o, isSecret: document.getElementById("new-poll-secret").checked, deadline: document.getElementById("new-poll-deadline").value, visibility: document.getElementById("new-poll-visibility").value }).then(r => { 
        setBtnLoading('btn-submit-poll', false, 'פתח הצבעה'); showToast(r.message, r.success?"success":"danger"); if(r.success) { newPollModalInstance.hide(); loadData(); } 
      });
    }

    function initiateVote(pollId) { const opt = document.querySelector(`input[name="poll_${pollId}"]:checked`); if (!opt) return showToast("בחר אפשרות להצבעה.", "warning"); const savedId = localStorage.getItem("authMemberId"); if (!savedId) authModalInstance.show(); else { setBtnLoading(`btn-vote-${pollId}`, true); apiCall('submitVote', {pollId, memberId: savedId, voteSelection: opt.value}).then(r => { setBtnLoading(`btn-vote-${pollId}`, false, 'שלח הצבעה'); showToast(r.message, r.success?"success":"danger"); }); } }
    
    function viewResults(pollId) {
      document.getElementById("resultsModalBody").innerHTML = '<div class="text-center py-5"><div class="spinner-border text-light"></div></div>';
      resultsModalInstance.show();
      apiCall('getPollResults', { pollId, memberId: localStorage.getItem("authMemberId") || "" }).then(res => {
        if(!res.success) return document.getElementById("resultsModalBody").innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
        document.getElementById("resultsModalBody").innerHTML = `<h4 class="mb-4 text-center fw-bold" style="color:#e0eafc;">סה"כ מצביעים: <span style="color:#00ff9d;">${res.total}</span></h4><div style="position: relative;"><div id="pollChart3D" style="height: 380px; width: 100%; direction: ltr;"></div></div>`;
        Highcharts.chart('pollChart3D', { chart: { type: 'pie', backgroundColor: 'transparent', options3d: { enabled: true, alpha: 45, beta: 0 } }, title: { text: null }, tooltip: { pointFormat: 'קולות: <b>{point.y}</b> ({point.percentage:.1f}%)', style: { fontFamily: 'Segoe UI', fontSize: '14px', direction: 'rtl' }, useHTML: true }, plotOptions: { pie: { innerSize: '55%', depth: 40, dataLabels: { enabled: true, format: '<b>{point.name}</b><br>{point.percentage:.1f}%', style: { color: '#ffffff', textOutline: 'none', fontSize: '15px' } }, colors: ['#00f2fe', '#f093fb', '#00ff9d', '#ff0844', '#f5576c'] } }, series: [{ name: 'תוצאות', data: res.results.map(r => ({ name: r.option, y: r.votes })) }], credits: { enabled: false } });
      });
    }

    function showAuthAlert(msg) { const a = document.getElementById("auth-alert"); a.className = `alert alert-danger mt-4 mb-0 fs-5 rounded-3 border-0`; a.innerHTML = msg; a.classList.remove("d-none"); }
    function hideAuthAlert() { document.getElementById("auth-alert").classList.add("d-none"); }
    
    function handleRequestOTP() {
      const id = document.getElementById("id-input").value.trim(); if(!id) return showAuthAlert("הקלד תעודת זהות."); hideAuthAlert();
      setBtnLoading('btn-request-otp', true);
      apiCall('requestOTP', { memberId: id }).then(res => { setBtnLoading('btn-request-otp', false, 'שלח קוד לאימייל'); if(res.success) { document.getElementById("step-1").classList.add("d-none"); document.getElementById("step-2").classList.remove("d-none"); } else showAuthAlert(res.message); });
    }
    
    function handleVerifyOTP() {
      const id = document.getElementById("id-input").value.trim(), otp = document.getElementById("otp-input").value.trim(); if(!otp) return showAuthAlert("הזן קוד."); hideAuthAlert();
      setBtnLoading('btn-verify-otp', true);
      apiCall('verifyOTP', { memberId: id, otp }).then(res => { setBtnLoading('btn-verify-otp', false, 'אמת'); if(res.success) { localStorage.setItem("authMemberId", id); setTimeout(() => { authModalInstance.hide(); checkLoginState(); }, 1000); } else showAuthAlert(res.message); });
    }
  </script>
</body>
</html>
